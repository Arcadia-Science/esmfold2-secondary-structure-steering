channels:
  - conda-forge
dependencies:
  # Notebook publication infrastructure
  - python=3.12
  - pre_commit=4.1.0
  - ruff=0.9.6
  - jupyterlab=4.3.5
  - pyyaml=6.0.2

  - pip
  - pip:
      # Publication analysis and figures
      - arcadia-pycolor==0.8.0
      # matplotlib 3.11 tightened LinearSegmentedColormap.from_list validation,
      # which breaks `import arcadia_pycolor` at 0.8.0. 3.10.6 is the newest
      # version the house palette imports against.
      - matplotlib==3.10.6
      - numpy==2.5.1
      - pandas==3.0.3
      - pyarrow==25.0.0

      # Structure parsing and secondary-structure assignment
      - biopython==1.87
      - biotite==1.6.0
      - pydssp==0.9.1
      # pydssp imports torch at module load, so torch is a transitive
      # requirement. Left unpinned deliberately: macOS x86_64 wheels stop at
      # torch 2.2.2, while arm64 goes far higher, so a single pin cannot serve
      # both. pydssp uses only basic tensor ops, so any resolvable version works.
      - torch

      # Campaign regeneration is deliberately NOT installed here. Nothing in
      # the notebook imports modal, and modal pulls cbor2, which ships no
      # macOS x86_64 wheel and builds through Rust. Install it separately
      # only to run campaigns on your own Modal account:
      #     pip install -r requirements-campaign.txt

      # Tests. tests/test_design_port.py proves analysis.design is a faithful
      # port of the ESM cookbook binder-design tutorial. It needs two more
      # things that are deliberately not installed here, because they are large
      # git dependencies that only the GPU container actually runs:
      #   pip install -e <clone of https://github.com/Biohub/esm>
      #     which also pulls git+https://github.com/Biohub/transformers
      # and ESM_REPO pointing at that clone, so the test can read the upstream
      # blob at commit ba4d712 out of git. Without them the port tests skip
      # with that message; every other test still runs.
      - pytest==8.4.2

      # Notebook publication infrastructure
      - jupyterlab-quarto==0.3.5
